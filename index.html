    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [currentView, setCurrentView] = useState('library'); // 'library' or 'reader'
      const [selectedBook, setSelectedBook] = useState(null);
      const [activeTab, setActiveTab] = useState('chapters'); // 'chapters' or 'flashcards'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // Categories list
      const categories = ['All', 'Finance & Economics', 'Personal Development', 'Biography & Sports', 'Entrepreneurship & Business', 'Psychology & Self-Help', 'Indian Literature & Society', 'Communication & Leadership'];

      // Filtered books
      const filteredBooks = useMemo(() => {
        return BOOKS_DATA.filter(book => {
          const matchesSearch = book.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                book.author.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCat = selectedCategory === 'All' || book.category === selectedCategory;
          return matchesSearch && matchesCat;
        });
      }, [searchQuery, selectedCategory]);

      const openBook = (book) => {
        setSelectedBook(book);
        setCurrentView('reader');
        setActiveTab('chapters');
        setCurrentCardIndex(0);
        setIsFlipped(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const closeBook = () => {
        setSelectedBook(null);
        setCurrentView('library');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          {/* Navbar */}
          <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={closeBook}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md font-bold text-lg">
                  📚
                </div>
                <div>
                  <h1 className="text-lg font-extrabold tracking-tight text-slate-900">Book Learner</h1>
                  <p className="text-xs text-slate-500 font-medium">Master Masterpieces in Minutes</p>
                </div>
              </div>
              <div className="flex items-center space-x-4">
                {currentView === 'reader' && (
                  <button 
                    onClick={closeBook}
                    className="inline-flex items-center text-sm font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3.5 py-2 rounded-xl transition">
                    ← Back to Library
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {currentView === 'library' ? (
              <div>
                {/* Hero Banner */}
                <div className="bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-700 rounded-3xl p-8 sm:p-12 text-white shadow-xl mb-8 relative overflow-hidden">
                  <div className="relative z-10 max-w-2xl">
                    <span className="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4 inline-block">
                      Ultimate Knowledge Hub
                    </span>
                    <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight mb-4">
                      Master 18 Bestselling Books & Core Takeaways
                    </h2>
                    <p className="text-indigo-100 text-base sm:text-lg mb-6 leading-relaxed">
                      Browse chapter summaries, test your knowledge with interactive flashcards, and accelerate your personal growth.
                    </p>
                    {/* Search Bar */}
                    <div className="relative">
                      <input 
                        type="text" 
                        placeholder="Search by book title or author..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full bg-white text-slate-900 placeholder-slate-400 px-5 py-3.5 pl-12 rounded-2xl shadow-lg focus:outline-none focus:ring-4 focus:ring-indigo-300 font-medium text-sm transition"
                      />
                      <svg className="w-5 h-5 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                      </svg>
                    </div>
                  </div>
                </div>

                {/* Category Filters */}
                <div className="flex items-center space-x-2 overflow-x-auto pb-4 mb-8 scrollbar-thin">
                  {categories.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition shadow-sm ${
                        selectedCategory === cat 
                          ? 'bg-indigo-600 text-white shadow-indigo-200' 
                          : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Book Grid */}
                {filteredBooks.length === 0 ? (
                  <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 shadow-sm">
                    <p className="text-slate-500 font-medium text-lg">No books found matching your search.</p>
                    <button 
                      onClick={() => { setSearchQuery(''); setSelectedCategory('All'); }}
                      className="mt-4 px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl text-sm"
                    >
                      Reset Filters
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredBooks.map((book) => (
                      <div 
                        key={book.id}
                        onClick={() => openBook(book)}
                        className="bg-white rounded-3xl border border-slate-200/80 shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300 cursor-pointer flex flex-col justify-between overflow-hidden group"
                      >
                        <div className={`h-3 bg-gradient-to-r ${book.color}`}></div>
                        <div className="p-6 flex-1 flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between mb-3">
                              <span className="text-xs font-extrabold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">
                                {book.category.split('&')[0]}
                              </span>
                              <span className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">
                                {book.chapters.length} Chapters
                              </span>
                            </div>
                            <h3 className="text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition mb-1">
                              {book.title}
                            </h3>
                            <p className="text-xs font-semibold text-slate-500 mb-3">By {book.author}</p>
                            <p className="text-slate-600 text-sm line-clamp-2 leading-relaxed">
                              {book.description}
                            </p>
                          </div>
                          <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                            <span className="text-xs font-bold text-indigo-600 group-hover:translate-x-1 transition duration-200 flex items-center gap-1">
                              Explore Chapters & Flashcards →
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              /* Reader & Flashcards View */
              <div className="max-w-4xl mx-auto">
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-10 mb-8">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                      <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                        {selectedBook.category}
                      </span>
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">{selectedBook.title}</h2>
                      <p className="text-sm font-semibold text-slate-500 mt-1">Written by {selectedBook.author}</p>
                    </div>
                    {/* View Switcher Tabs */}
                    <div className="flex bg-slate-100 p-1.5 rounded-2xl self-start">
                      <button
                        onClick={() => setActiveTab('chapters')}
                        className={`px-4 py-2 rounded-xl text-sm font-bold transition ${
                          activeTab === 'chapters' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        📖 Chapters ({selectedBook.chapters.length})
                      </button>
                      <button
                        onClick={() => { setActiveTab('flashcards'); setCurrentCardIndex(0); setIsFlipped(false); }}
                        className={`px-4 py-2 rounded-xl text-sm font-bold transition ${
                          activeTab === 'flashcards' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        🎴 Flashcards
                      </button>
                    </div>
                  </div>
                  <p className="text-slate-600 text-sm sm:text-base leading-relaxed bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    {selectedBook.description}
                  </p>
                </div>

                {/* Tab 1: Chapter Summaries */}
                {activeTab === 'chapters' && (
                  <div className="space-y-4">
                    <h3 className="text-xl font-bold text-slate-900 mb-4 px-2">Chapter-by-Chapter Key Takeaways</h3>
                    {selectedBook.chapters.map((ch, idx) => (
                      <div key={idx} className="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm hover:border-indigo-200 transition">
                        <div className="flex items-start justify-between gap-4 mb-2">
                          <h4 className="text-base font-bold text-indigo-900">
                            Chapter {ch.number || idx + 1}: {ch.title}
                          </h4>
                          <span className="text-xs font-bold text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg">
                            #{(idx + 1)}
                          </span>
                        </div>
                        <p className="text-slate-700 text-sm leading-relaxed">
                          <strong className="text-slate-900 font-semibold">Key Takeaway:</strong> {ch.takeaway}
                        </p>
                      </div>
                    ))}
                  </div>
                )}

                {/* Tab 2: Interactive Flashcard Mode */}
                {activeTab === 'flashcards' && (
                  <div className="flex flex-col items-center">
                    <div className="w-full max-w-xl mb-4 flex items-center justify-between px-2">
                      <span className="text-sm font-bold text-slate-500">
                        Card {currentCardIndex + 1} of {selectedBook.chapters.length}
                      </span>
                      <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                        Click card to flip
                      </span>
                    </div>

                    {/* 3D Flashcard */}
                    <div 
                      className="w-full max-w-xl h-80 perspective-1000 cursor-pointer select-none"
                      onClick={() => setIsFlipped(!isFlipped)}
                    >
                      <div className={`relative w-full h-full duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                        {/* Front of Card */}
                        <div className="absolute inset-0 w-full h-full bg-white border border-slate-200 rounded-3xl p-8 shadow-md flex flex-col justify-between backface-hidden">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                              Chapter {selectedBook.chapters[currentCardIndex].number || currentCardIndex + 1}
                            </span>
                            <span className="text-xs text-slate-400 font-semibold">Front</span>
                          </div>
                          <div className="text-center my-auto">
                            <h3 className="text-xl sm:text-2xl font-bold text-slate-900">
                              {selectedBook.chapters[currentCardIndex].title}
                            </h3>
                          </div>
                          <p className="text-center text-xs font-bold text-slate-400 tracking-wide uppercase">
                            Tap to reveal key takeaway ↓
                          </p>
                        </div>

                        {/* Back of Card */}
                        <div className="absolute inset-0 w-full h-full bg-slate-900 text-white border border-slate-800 rounded-3xl p-8 shadow-xl flex flex-col justify-between backface-hidden rotate-y-180">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-950 px-3 py-1 rounded-full">
                              Key Takeaway
                            </span>
                            <span className="text-xs text-slate-400 font-semibold">Back</span>
                          </div>
                          <div className="text-center my-auto">
                            <p className="text-base sm:text-lg font-medium text-slate-100 leading-relaxed">
                              "{selectedBook.chapters[currentCardIndex].takeaway}"
                            </p>
                          </div>
                          <p className="text-center text-xs font-bold text-slate-400 tracking-wide uppercase">
                            Tap to flip back ↑
                          </p>
                        </div>
                      </div>
                    </div>

                    {/* Flashcard Navigation Controls */}
                    <div className="flex items-center space-x-4 mt-6">
                      <button 
                        onClick={() => {
                          setIsFlipped(false);
                          setCurrentCardIndex(prev => (prev > 0 ? prev - 1 : selectedBook.chapters.length - 1));
                        }}
                        className="px-5 py-2.5 bg-white border border-slate-200 rounded-xl font-bold text-sm text-slate-700 hover:bg-slate-100 shadow-sm transition"
                      >
                        ← Previous
                      </button>
                      <button 
                        onClick={() => {
                          setIsFlipped(false);
                          setCurrentCardIndex(prev => (prev < selectedBook.chapters.length - 1 ? prev + 1 : 0));
                        }}
                        className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-md transition"
                      >
                        Next Card →
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-8 mt-16 text-center text-slate-500 text-sm">
            <p>© 2026 Book Learner App. All 18 books fully integrated.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
