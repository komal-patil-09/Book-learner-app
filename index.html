<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="module">

    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpD5Pb8oQl7fkcEhw36nPTBUrAg6l2L70",
      authDomain: "book-learner-app.firebaseapp.com",
      projectId: "book-learner-app",
      storageBucket: "book-learner-app.firebasestorage.app",
      messagingSenderId: "225126768050",
      appId: "1:225126768050:web:2be85bb979b34b68f4d8ab",
      measurementId: "G-1GMV26TH2N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.GoogleAuthProvider = GoogleAuthProvider;
    window.signInWithPopup = signInWithPopup;
    window.signOut = signOut;
    window.onAuthStateChanged = onAuthStateChanged;
    window.firestoreDoc = doc;
    window.firestoreSetDoc = setDoc;
    window.firestoreGetDoc = getDoc;
  </script>

      },
      {
        id: "psychology-of-money",
        title: "The Psychology of Money",

        description: "Timeless lessons on wealth, greed, and happiness through behavioral psychology.",
        chapters: [

          { number: 5, title: "Getting Wealthy vs. Staying Wealthy", takeaway: "Getting rich requires taking risks, but staying rich requires paranoia, frugality, and diversification." },
          { number: 6, title: "Tails, You Win", takeaway: "Long-term success often relies on a tiny percentage of outlier bets paying off massively." },

          { number: 9, title: "Wealth is What You Don't See", takeaway: "Spending money to show people you have money is the fastest way to have less money." },

      },
      {
        id: "zero-to-one",
        title: "Zero to One",
        author: "Peter Thiel & Blake Masters",

        description: "Notes on startups, building the future, and going from 0 to 1 instead of copying others.",
        chapters: [
          { number: 1, title: "The Challenge of the Future", takeaway: "True societal progress stems from vertical innovation (going from 0 to 1), not horizontal imitation (going from 1 to N)." },
          { number: 2, title: "Party Like It’s 1999", takeaway: "Sustainable businesses focus on fundamental business execution and customer value rather than chasing market hype bubbles." },

        ]
      },
      {
        id: "atomic-habits",
        title: "Atomic Habits",
        author: "James Clear",
        category: "Personal Development",
        color: "from-purple-600 to-indigo-700",
        description: "An easy & proven way to build good habits & break bad ones with tiny 1% gains.",
        chapters: [
          { number: 1, title: "The Surprising Power of Atomic Habits", takeaway: "Tiny 1% improvements compound into massive long-term results over a year." },
          { number: 2, title: "How Your Habits Shape Your Identity", takeaway: "Focus on identity-based habits; decide who you wish to become, then prove it with small wins." },
          { number: 3, title: "4 Simple Steps to Better Habits", takeaway: "The habit loop consists of Cue, Craving, Response, and Reward." },

        ]
      }
    ];

    function App() {
      const [currentView, setCurrentView] = useState('library');
      const [selectedBook, setSelectedBook] = useState(null);
      const [activeTab, setActiveTab] = useState('chapters');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [user, setUser] = useState(null);

      useEffect(() => {
        const interval = setInterval(() => {
          if (window.firebaseAuth && window.onAuthStateChanged) {
            clearInterval(interval);
            window.onAuthStateChanged(window.firebaseAuth, (currentUser) => {
              setUser(currentUser);
            });
          }
        }, 200);
        return () => clearInterval(interval);
      }, []);

      const handleGoogleLogin = async () => {
        if (window.firebaseAuth && window.signInWithPopup) {
          try {
            const provider = new window.GoogleAuthProvider();
            await window.signInWithPopup(window.firebaseAuth, provider);
          } catch (error) {
            console.error("Login failed:", error);
          }
        }
      };

      const handleLogout = async () => {
        if (window.firebaseAuth && window.signOut) {
          await window.signOut(window.firebaseAuth);
        }
      };

      const categories = ['All', 'Finance & Economics', 'Personal Development', 'Biography & Sports', 'Entrepreneurship & Business', 'Indian Literature & Leadership'];

      const filteredBooks = useMemo(() => {
        return BOOKS_DATA.filter(book => {
          const matchesSearch = book.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                book.author.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCat = selectedCategory === 'All' || book.category === selectedCategory;
          return matchesSearch && matchesCat;
        });
      }, [searchQuery, selectedCategory]);

      const openBook = (book) => {
        setSelectedBook(book);
        setCurrentView('reader');
        setActiveTab('chapters');
        setCurrentCardIndex(0);
        setIsFlipped(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const closeBook = () => {
        setSelectedBook(null);
        setCurrentView('library');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={closeBook}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md font-bold text-lg">
                  📚
                </div>
                <div>
                  <h1 className="text-lg font-extrabold tracking-tight text-slate-900">Book Learner</h1>
                  <p className="text-xs text-slate-500 font-medium">Master Masterpieces in Minutes</p>
                </div>
              </div>
              <div className="flex items-center space-x-3">
                {user ? (
                  <div className="flex items-center space-x-3">
                    <span className="text-xs font-bold text-slate-700 hidden sm:inline">
                      {user.displayName || user.email}
                    </span>
                    <button 
                      onClick={handleLogout}
                      className="text-xs font-semibold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 px-3.5 py-2 rounded-xl transition">
                      Logout
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={handleGoogleLogin}
                    className="inline-flex items-center text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-xl shadow-sm transition">
                    Sign In with Google
                  </button>
                )}

                {currentView === 'reader' && (
                  <button 
                    onClick={closeBook}
                    className="inline-flex items-center text-sm font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3.5 py-2 rounded-xl transition">
                    ← Back to Library
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {currentView === 'library' ? (
              <div>
                <div className="bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-700 rounded-3xl p-8 sm:p-12 text-white shadow-xl mb-8">
                  <div className="max-w-2xl">
                    <span className="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4 inline-block">
                      Ultimate Knowledge Hub
                    </span>
                    <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight mb-4">
                      Master Key Books & Core Takeaways
                    </h2>
                    <p className="text-indigo-100 text-base sm:text-lg mb-6 leading-relaxed">
                      Browse chapter summaries, test your knowledge with interactive flashcards, and accelerate your personal growth.
                    </p>
                    <input 
                      type="text" 
                      placeholder="Search by book title or author..." 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-white text-slate-900 placeholder-slate-400 px-5 py-3.5 rounded-2xl shadow-lg focus:outline-none focus:ring-4 focus:ring-indigo-300 font-medium text-sm transition"
                    />
                  </div>
                </div>

                <div className="flex items-center space-x-2 overflow-x-auto pb-4 mb-8">
                  {categories.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${
                        selectedCategory === cat 
                          ? 'bg-indigo-600 text-white' 
                          : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredBooks.map((book) => (
                    <div 
                      key={book.id}
                      onClick={() => openBook(book)}
                      className="bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300 cursor-pointer flex flex-col justify-between overflow-hidden group"
                    >
                      <div className={`h-3 bg-gradient-to-r ${book.color}`}></div>
                      <div className="p-6 flex-1 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-xs font-extrabold uppercase text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">
                              {book.category.split('&')[0]}
                            </span>
                            <span className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">
                              {book.chapters.length} Chapters
                            </span>
                          </div>
                          <h3 className="text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition mb-1">
                            {book.title}
                          </h3>
                          <p className="text-xs font-semibold text-slate-500 mb-3">By {book.author}</p>
                          <p className="text-slate-600 text-sm line-clamp-2">
                            {book.description}
                          </p>
                        </div>
                        <div className="mt-6 pt-4 border-t border-slate-100">
                          <span className="text-xs font-bold text-indigo-600">
                            Explore Chapters & Flashcards →
                          </span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div className="max-w-4xl mx-auto">
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-10 mb-8">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                      <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase">
                        {selectedBook.category}
                      </span>
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">{selectedBook.title}</h2>
                      <p className="text-sm font-semibold text-slate-500 mt-1">Written by {selectedBook.author}</p>
                    </div>
                    <div className="flex bg-slate-100 p-1.5 rounded-2xl self-start">
                      <button
                        onClick={() => setActiveTab('chapters')}
                        className={`px-4 py-2 rounded-xl text-sm font-bold transition ${
                          activeTab === 'chapters' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'
                        }`}
                      >
                        📖 Chapters ({selectedBook.chapters.length})
                      </button>
                      <button
                        onClick={() => { setActiveTab('flashcards'); setCurrentCardIndex(0); setIsFlipped(false); }}
                        className={`px-4 py-2 rounded-xl text-sm font-bold transition ${
                          activeTab === 'flashcards' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'
                        }`}
                      >
                        🎴 Flashcards
                      </button>
                    </div>
                  </div>
                </div>

                {activeTab === 'chapters' && (
                  <div className="space-y-4">
                    <h3 className="text-xl font-bold text-slate-900 mb-4 px-2">Chapter Key Takeaways</h3>
                    {selectedBook.chapters.map((ch, idx) => (
                      <div key={idx} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                        <h4 className="text-base font-bold text-indigo-900 mb-1">
                          Chapter {ch.number || idx + 1}: {ch.title}
                        </h4>
                        <p className="text-slate-700 text-sm">
                          <strong className="text-slate-900 font-semibold">Takeaway:</strong> {ch.takeaway}
                        </p>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'flashcards' && (
                  <div className="flex flex-col items-center">
                    <div className="w-full max-w-xl mb-4 flex items-center justify-between px-2">
                      <span className="text-sm font-bold text-slate-500">
                        Card {currentCardIndex + 1} of {selectedBook.chapters.length}
                      </span>
                      <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                        Tap card to flip
                      </span>
                    </div>

                    <div 
                      className="w-full max-w-xl h-80 perspective-1000 cursor-pointer select-none"
                      onClick={() => setIsFlipped(!isFlipped)}
                    >
                      <div className={`relative w-full h-full duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                        <div className="absolute inset-0 w-full h-full bg-white border border-slate-200 rounded-3xl p-8 shadow-md flex flex-col justify-between backface-hidden">
                          <span className="text-xs font-bold uppercase text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full self-start">
                            Chapter {selectedBook.chapters[currentCardIndex].number || currentCardIndex + 1}
                          </span>
                          <div className="text-center my-auto">
                            <h3 className="text-xl sm:text-2xl font-bold text-slate-900">
                              {selectedBook.chapters[currentCardIndex].title}
                            </h3>
                          </div>
                          <p className="text-center text-xs font-bold text-slate-400 tracking-wide uppercase">
                            Click to reveal key takeaway ↓
                          </p>
                        </div>

                        <div className="absolute inset-0 w-full h-full bg-slate-900 text-white border border-slate-800 rounded-3xl p-8 shadow-xl flex flex-col justify-between backface-hidden rotate-y-180">
                          <span className="text-xs font-bold uppercase text-emerald-400 bg-emerald-950 px-3 py-1 rounded-full self-start">
                            Key Takeaway
                          </span>
                          <div className="text-center my-auto">
                            <p className="text-base sm:text-lg font-medium text-slate-100 leading-relaxed">
                              "{selectedBook.chapters[currentCardIndex].takeaway}"
                            </p>
                          </div>
                          <p className="text-center text-xs font-bold text-slate-400 tracking-wide uppercase">
                            Click to flip back ↑
                          </p>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center space-x-4 mt-6">
                      <button 
                        onClick={() => {
                          setIsFlipped(false);
                          setCurrentCardIndex(prev => (prev > 0 ? prev - 1 : selectedBook.chapters.length - 1));
                        }}
                        className="px-5 py-2.5 bg-white border border-slate-200 rounded-xl font-bold text-sm text-slate-700 hover:bg-slate-100 shadow-sm"
                      >
                        ← Previous
                      </button>
                      <button 
                        onClick={() => {
                          setIsFlipped(false);
                          setCurrentCardIndex(prev => (prev < selectedBook.chapters.length - 1 ? prev + 1 : 0));
                        }}
                        className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-md"
                      >
                        Next Card →
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
