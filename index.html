    // --- MAIN APP COMPONENT ---
    function App() {
      const [selectedBook, setSelectedBook] = useState(null);
      const [activeTab, setActiveTab] = useState('chapters'); // 'chapters', 'flashcards', 'quiz'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [completedChapters, setCompletedChapters] = useState(() => {
        try {
          const saved = localStorage.getItem('book_learner_progress');
          return saved ? JSON.parse(saved) : {};
        } catch(e) {
          return {};
        }
      });

      // Flashcard State
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // Quiz State
      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizFinished, setQuizFinished] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('book_learner_progress', JSON.stringify(completedChapters));
        } catch(e){}
      }, [completedChapters]);

      // Categories
      const categories = ['All', 'Finance & Economics', 'Finance & Personal Development', 'Personal Development', 'Biography & Sports', 'Entrepreneurship & Business', 'Psychology & Self-Help', 'Indian Literature & Leadership', 'Communication & Leadership'];

      const filteredBooks = useMemo(() => {
        return BOOKS_DATA.filter(book => {
          const matchesCategory = selectedCategory === 'All' || book.category === selectedCategory;
          const matchesSearch = book.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                book.author.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                book.chapters.some(c => c.title.toLowerCase().includes(searchQuery.toLowerCase()) || c.takeaway.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCategory && matchesSearch;
        });
      }, [searchQuery, selectedCategory]);

      const toggleChapterComplete = (bookId, chapNum) => {
        const key = `${bookId}_ch_${chapNum}`;
        setCompletedChapters(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const handleOpenBook = (book) => {
        setSelectedBook(book);
        setActiveTab('chapters');
        setCardIndex(0);
        setIsFlipped(false);
        resetQuiz();
      };

      const resetQuiz = () => {
        setQuizIndex(0);
        setSelectedOption(null);
        setQuizScore(0);
        setQuizFinished(false);
      };

      // Generated Quiz questions for selected book
      const quizQuestions = useMemo(() => {
        if (!selectedBook) return [];
        return selectedBook.chapters.map((ch, idx) => {
          // generate options
          const otherChapters = selectedBook.chapters.filter((_, i) => i !== idx);
          const wrong1 = otherChapters[0]?.takeaway || "Focus exclusively on short term gains.";
          const wrong2 = otherChapters[1]?.takeaway || "Ignore environment and rely purely on luck.";
          const wrong3 = "Avoid taking action until all parameters are perfectly predictable.";
          
          const options = [ch.takeaway, wrong1, wrong2, wrong3].sort(() => 0.5 - Math.random());
          return {
            question: `What is the key takeaway for Chapter ${ch.number}: "${ch.title}"?`,
            correctAnswer: ch.takeaway,
            options: options
          };
        });
      }, [selectedBook]);

      const handleQuizAnswer = (option) => {
        if (selectedOption !== null) return;
        setSelectedOption(option);
        if (option === quizQuestions[quizIndex].correctAnswer) {
          setQuizScore(s => s + 1);
        }
      };

      const handleNextQuiz = () => {
        if (quizIndex + 1 < quizQuestions.length) {
          setQuizIndex(i => i + 1);
          setSelectedOption(null);
        } else {
          setQuizFinished(true);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
          {/* HEADER / NAVIGATION */}
          <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setSelectedBook(null)}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/30">
                  BL
                </div>
                <div>
                  <h1 className="font-bold text-lg text-white tracking-wide">BookLearner</h1>
                  <p className="text-xs text-slate-400">18 Books • Complete Chapters & Takeaways</p>
                </div>
              </div>

              {selectedBook && (
                <button 
                  onClick={() => setSelectedBook(null)}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 transition"
                >
                  ← Back to Library
                </button>
              )}
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {!selectedBook ? (
              /* HOME / LIBRARY VIEW */
              <div className="space-y-8">
                {/* HERO BANNER */}
                <div className="relative rounded-3xl p-8 sm:p-12 overflow-hidden bg-gradient-to-r from-indigo-900 via-slate-900 to-purple-950 border border-slate-800 shadow-2xl">
                  <div className="max-w-2xl relative z-10 space-y-4">
                    <span className="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider text-indigo-400 bg-indigo-950/80 border border-indigo-800/50 rounded-full">
                      Full Master Directory
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-black text-white tracking-tight leading-tight">
                      Master Key Takeaways from 18 Classic Books
                    </h2>
                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                      Every single chapter mapped out explicitly with zero missing content. Browse chapter lists, flip through flashcards, and test your knowledge.
                    </p>
                  </div>
                </div>

                {/* SEARCH & FILTERS */}
                <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                  {/* Search input */}
                  <div className="relative w-full md:w-96">
                    <input 
                      type="text"
                      placeholder="Search title, author, or takeaway..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition"
                    />
                  </div>

                  {/* Category Pills */}
                  <div className="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none">
                    {categories.map((cat) => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition ${
                          selectedCategory === cat 
                            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                            : 'bg-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-700'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* BOOK GRID */}
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-xl font-bold text-white">All Books ({filteredBooks.length})</h3>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredBooks.map((book) => {
                      const completedCount = book.chapters.filter(ch => completedChapters[`${book.id}_ch_${ch.number}`]).length;
                      const percent = Math.round((completedCount / book.chapters.length) * 100);

                      return (
                        <div 
                          key={book.id}
                          onClick={() => handleOpenBook(book)}
                          className="group bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-indigo-500/50 rounded-2xl p-6 transition duration-300 cursor-pointer flex flex-col justify-between shadow-lg hover:shadow-indigo-500/10"
                        >
                          <div>
                            <div className="flex items-center justify-between gap-2 mb-3">
                              <span className="text-[11px] font-semibold text-indigo-400 bg-indigo-950/60 px-2.5 py-0.5 rounded-md border border-indigo-900/40">
                                {book.category}
                              </span>
                              <span className="text-xs text-slate-400 font-mono">
                                {book.chapters.length} Chapters
                              </span>
                            </div>

                            <div className={`h-2.5 w-12 rounded-full bg-gradient-to-r ${book.color} mb-3`}></div>

                            <h4 className="text-xl font-bold text-white group-hover:text-indigo-300 transition line-clamp-1">
                              {book.title}
                            </h4>
                            <p className="text-xs text-slate-400 mb-3">by {book.author}</p>
                            <p className="text-slate-300 text-xs line-clamp-2 leading-relaxed mb-4">
                              {book.description}
                            </p>
                          </div>

                          <div>
                            {/* Progress bar */}
                            <div className="space-y-1.5 pt-3 border-t border-slate-700/50">
                              <div className="flex justify-between text-[11px] text-slate-400">
                                <span>Progress</span>
                                <span>{completedCount}/{book.chapters.length} chapters ({percent}%)</span>
                              </div>
                              <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                                <div 
                                  className="bg-indigo-500 h-full transition-all duration-300"
                                  style={{ width: `${percent}%` }}
                                ></div>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            ) : (
              /* BOOK DETAIL & STUDY VIEW */
              <div className="space-y-6">
                {/* BOOK HERO HEADER */}
                <div className={`p-8 sm:p-10 rounded-3xl bg-gradient-to-r ${selectedBook.color} text-white shadow-2xl relative overflow-hidden`}>
                  <div className="relative z-10 space-y-3">
                    <span className="px-3 py-1 bg-black/30 backdrop-blur rounded-full text-xs font-semibold tracking-wider uppercase border border-white/10">
                      {selectedBook.category}
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-black">{selectedBook.title}</h2>
                    <p className="text-lg text-white/90 font-medium">By {selectedBook.author}</p>
                    <p className="text-sm text-white/80 max-w-2xl">{selectedBook.description}</p>
                  </div>
                </div>

                {/* NAVIGATION TABS */}
                <div className="flex border-b border-slate-800 gap-6">
                  <button
                    onClick={() => setActiveTab('chapters')}
                    className={`pb-3 font-semibold text-sm transition relative ${
                      activeTab === 'chapters' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    📖 All Chapters ({selectedBook.chapters.length})
                  </button>
                  <button
                    onClick={() => setActiveTab('flashcards')}
                    className={`pb-3 font-semibold text-sm transition relative ${
                      activeTab === 'flashcards' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    🎴 Flashcards Practice
                  </button>
                  <button
                    onClick={() => setActiveTab('quiz')}
                    className={`pb-3 font-semibold text-sm transition relative ${
                      activeTab === 'quiz' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    🧠 Knowledge Quiz
                  </button>
                </div>

                {/* TAB 1: CHAPTERS LIST */}
                {activeTab === 'chapters' && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between text-sm text-slate-400 mb-2">
                      <span>Click checkbox to mark chapters as learned</span>
                      <span>{selectedBook.chapters.filter(ch => completedChapters[`${selectedBook.id}_ch_${ch.number}`]).length} / {selectedBook.chapters.length} Completed</span>
                    </div>

                    <div className="grid grid-cols-1 gap-4">
                      {selectedBook.chapters.map((chap) => {
                        const isDone = !!completedChapters[`${selectedBook.id}_ch_${chap.number}`];
                        return (
                          <div 
                            key={chap.number}
                            className={`p-5 rounded-2xl border transition duration-200 flex items-start gap-4 ${
                              isDone 
                                ? 'bg-slate-900/60 border-slate-800 opacity-75' 
                                : 'bg-slate-800/90 border-slate-700/80 hover:border-slate-600'
                            }`}
                          >
                            <button
                              onClick={() => toggleChapterComplete(selectedBook.id, chap.number)}
                              className={`mt-1 w-6 h-6 rounded-lg flex items-center justify-center border transition shrink-0 ${
                                isDone 
                                  ? 'bg-emerald-500 border-emerald-500 text-white' 
                                  : 'border-slate-600 bg-slate-900 hover:border-indigo-500'
                              }`}
                            >
                              {isDone && <span className="text-xs font-bold">✓</span>}
                            </button>

                            <div className="space-y-1 flex-1">
                              <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-indigo-400">Chapter {chap.number}</span>
                              </div>
                              <h3 className={`text-lg font-bold text-white ${isDone ? 'line-through text-slate-400' : ''}`}>
                                {chap.title}
                              </h3>
                              <p className="text-sm text-slate-300 leading-relaxed pt-1">
                                <strong className="text-indigo-300 font-semibold">Key Takeaway:</strong> {chap.takeaway}
                              </p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* TAB 2: FLASHCARDS */}
                {activeTab === 'flashcards' && (
                  <div className="max-w-2xl mx-auto py-6 space-y-6">
                    <div className="flex items-center justify-between text-sm text-slate-400">
                      <span>Card {cardIndex + 1} of {selectedBook.chapters.length}</span>
                      <span>Click card to flip</span>
                    </div>

                    {/* FLASHCARD CONTAINER */}
                    <div 
                      onClick={() => setIsFlipped(!isFlipped)}
                      className="cursor-pointer perspective-1000 h-80 w-full"
                    >
                      <div className={`relative w-full h-full duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                        {/* FRONT SIDE (Question / Chapter Title) */}
                        <div className="absolute inset-0 bg-slate-800 border-2 border-indigo-500/40 rounded-3xl p-8 flex flex-col justify-between backface-hidden shadow-xl">
                          <div className="flex justify-between items-center text-xs text-indigo-400 font-semibold tracking-wider uppercase">
                            <span>{selectedBook.title}</span>
                            <span>Chapter {selectedBook.chapters[cardIndex].number}</span>
                          </div>
                          <div className="text-center space-y-2">
                            <p className="text-xs text-slate-400 uppercase tracking-widest">Chapter Title</p>
                            <h3 className="text-2xl font-bold text-white">
                              {selectedBook.chapters[cardIndex].title}
                            </h3>
                          </div>
                          <div className="text-center text-xs text-slate-400">
                            👆 Tap card to reveal key takeaway
                          </div>
                        </div>

                        {/* BACK SIDE (Key Takeaway) */}
                        <div className="absolute inset-0 bg-indigo-950 border-2 border-indigo-400 rounded-3xl p-8 flex flex-col justify-between backface-hidden rotate-y-180 shadow-xl">
                          <div className="flex justify-between items-center text-xs text-indigo-300 font-semibold tracking-wider uppercase">
                            <span>Key Takeaway</span>
                            <span>Chapter {selectedBook.chapters[cardIndex].number}</span>
                          </div>
                          <div className="text-center">
                            <p className="text-lg text-slate-100 font-medium leading-relaxed">
                              "{selectedBook.chapters[cardIndex].takeaway}"
                            </p>
                          </div>
                          <div className="text-center text-xs text-indigo-300">
                            👆 Tap card to flip back
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* FLASHCARD CONTROLS */}
                    <div className="flex items-center justify-between pt-2">
                      <button
                        disabled={cardIndex === 0}
                        onClick={() => { setCardIndex(i => i - 1); setIsFlipped(false); }}
                        className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed font-medium text-sm transition"
                      >
                        ← Previous
                      </button>
                      <span className="text-sm text-slate-400 font-mono">
                        {cardIndex + 1} / {selectedBook.chapters.length}
                      </span>
                      <button
                        disabled={cardIndex === selectedBook.chapters.length - 1}
                        onClick={() => { setCardIndex(i => i + 1); setIsFlipped(false); }}
                        className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed font-medium text-sm transition text-white"
                      >
                        Next →
                      </button>
                    </div>
                  </div>
                )}

                {/* TAB 3: QUIZ MODE */}
                {activeTab === 'quiz' && (
                  <div className="max-w-2xl mx-auto py-6 space-y-6">
                    {!quizFinished ? (
                      <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 space-y-6">
                        <div className="flex items-center justify-between text-xs text-slate-400 pb-4 border-b border-slate-700">

                          <span>Score: {quizScore}</span>
                        </div>

                        <div>
                          <h3 className="text-xl font-bold text-white leading-snug">
                            {quizQuestions[quizIndex]?.question}
                          </h3>
                        </div>

                          {quizQuestions[quizIndex]?.options.map((opt, idx) => {
                            const isSelected = selectedOption === opt;
                            const isCorrect = opt === quizQuestions[quizIndex].correctAnswer;
                            let btnStyle = "bg-slate-900 border-slate-700 hover:border-slate-500 text-slate-200";

                            if (selectedOption !== null) {
                              if (isCorrect) btnStyle = "bg-emerald-950 border-emerald-500 text-emerald-200 font-medium";
                              else if (isSelected) btnStyle = "bg-rose-950 border-rose-500 text-rose-200";
                              else btnStyle = "bg-slate-900/50 border-slate-800 text-slate-500";
                            }

                            return (
                              <button
                                key={idx}
                                disabled={selectedOption !== null}
                                onClick={() => handleQuizAnswer(opt)}
                                className={`w-full text-left p-4 rounded-xl border text-sm transition duration-200 flex items-start gap-3 ${btnStyle}`}
                              >
                                <span className="font-mono text-xs opacity-60 mt-0.5">{String.fromCharCode(65 + idx)}.</span>
                                <span>{opt}</span>
                              </button>
                            );
                          })}
                        </div>

                        {selectedOption !== null && (
                          <div className="pt-4 flex justify-end">
                            <button
                              onClick={handleNextQuiz}
                              className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition shadow-lg shadow-indigo-600/30"
                            >
                              {quizIndex + 1 === quizQuestions.length ? "See Results" : "Next Question →"}
                            </button>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center space-y-6">
                        <div className="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                          🏆
                        </div>
                        <h3 className="text-2xl font-bold text-white">Quiz Completed!</h3>
                        <p className="text-slate-300">
                          You scored <span className="text-indigo-400 font-bold text-xl">{quizScore}</span> out of <span className="font-bold">{quizQuestions.length}</span>
                        </p>
                        <button
                          onClick={resetQuiz}
                          className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition"
                        >
                          Retake Quiz
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-slate-950 py-6 mt-12">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
              BookLearner • Complete master library of 18 classic books & key takeaways
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
